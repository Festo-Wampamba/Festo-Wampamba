<svg xmlns="http://www.w3.org/2000/svg" width="900" height="238" viewBox="0 0 900 238" role="img" aria-labelledby="title description"><title id="title">Founder of Lupora Tech · System Administrator · Full-Stack Developer · Tech Educator</title><desc id="description">Festo Wampamba is a Systems Engineer and the founder of Lupora Tech, a startup dedicated to engineering ground-up solutions for the African tech ecosystem. While a seasoned Full-Stack Developer, his core expertise lies in Systems Administration and Networking, ensuring that the innovations built at Lupora Tech are backed by robust, high-performance infrastructure</desc><defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#8a5e00" stop-opacity=".055"/></linearGradient></defs><g aria-label="Founder of Lupora Tech"><rect x="0.5" y="0.5" width="239" height="53" rx="12" fill="#fffefa" fill-opacity=".86"/><rect x="0.5" y="0.5" width="239" height="53" rx="12" fill="url(#glass)" stroke="#deded4"/><path d="M14 1.5h212" stroke="#ffffff" stroke-opacity=".95"/><text text-anchor="middle" fill="#252821" font-family="Arial,sans-serif" font-size="18.5" font-weight="500"><tspan x="120" y="33">Founder of Lupora Tech</tspan></text></g><g aria-label="System Administrator"><rect x="252.5" y="0.5" width="230" height="53" rx="12" fill="#fffefa" fill-opacity=".86"/><rect x="252.5" y="0.5" width="230" height="53" rx="12" fill="url(#glass)" stroke="#deded4"/><path d="M266 1.5h203" stroke="#ffffff" stroke-opacity=".95"/><text text-anchor="middle" fill="#252821" font-family="Arial,sans-serif" font-size="18.5" font-weight="500"><tspan x="367.5" y="33">System Administrator</tspan></text></g><g aria-label="Full-Stack Developer"><rect x="495.5" y="0.5" width="224" height="53" rx="12" fill="#fffefa" fill-opacity=".86"/><rect x="495.5" y="0.5" width="224" height="53" rx="12" fill="url(#glass)" str