name: Refresh GitHub overview
on:
  schedule:
    - cron: '0 23 * * *' # Around 02:00 Africa/Kampala
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/stats-*.mjs'
      - 'scripts/generate-stats.mjs'
      - 'scripts/palette.mjs'
      - '.github/workflows/update-stats.yml'
permissions:
  contents: read
concurrency:
  group: profile-stats-refresh
  cancel-in-progress: false
jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test
      - name: Refresh saved profile snapshot
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: node scripts/generate-stats.mjs
      - run: node scripts/build.mjs
      - name: Save successful refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-stats.json assets/profile-stats.svg assets/profile-stats-light.svg assets/profile-stats-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile statistics'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Request Vercel rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 --request POST "$DEPLOY_HOOK" --output /dev/null
          fi
