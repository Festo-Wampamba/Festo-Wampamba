name: Update YouTube Cards

on:
  schedule:
    - cron: '0 0 * * *' # Around 03:00 Africa/Kampala; GitHub can delay schedules.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/videos.mjs'
      - 'scripts/generate-videos.mjs'
      - 'scripts/profile-card-ui.mjs'
      - 'tests/videos.test.mjs'
      - '.github/workflows/youtube-cards.yml'

permissions:
  contents: read
concurrency:
  group: youtube-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/videos.test.mjs
      - name: Refresh official video statistics and saved thumbnails
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/generate-videos.mjs
      - name: Save successful cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git remote set-url origin https://github.com/Festo-Wampamba/Festo-Wampamba.git
          git add assets/featured-videos.json assets/videos README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh featured YouTube videos'
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          exit 1
